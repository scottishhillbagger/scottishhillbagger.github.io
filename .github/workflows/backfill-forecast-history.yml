# One-off: rebuild data/forecast-history.csv from every past commit of forecast.json.
# Run from GitHub: Actions tab → "Backfill forecast history" → Run workflow.
# Safe to run more than once (duplicates are skipped).
name: Backfill forecast history

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history is needed to read old forecast.json versions

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/backfill-forecast-history.mjs

      - name: Commit history CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/forecast-history.csv
          git diff --cached --quiet || git commit -m "Backfill forecast history from git"
          git push
